name: Build Trackpad apps
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build APK
        working-directory: mobile-app
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Trackpad-Android-APK
          path: mobile-app/android/app/build/outputs/apk/release/*.apk

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build installer
        working-directory: pc-app
        run: |
          npm ci
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Trackpad-Windows-Setup
          path: pc-app/dist/*.exe
